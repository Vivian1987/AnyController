name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  # Pinned to the SDK version the payload is tested with.
  SDK_VERSION: v0.45

jobs:
  build:
    name: Build payload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          # llvm provides llvm-config, which the SDK's clang wrapper needs.
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm make unzip curl

      - name: Install PS5 payload SDK
        run: |
          curl -fsSL -o sdk.zip \
            "https://github.com/ps5-payload-dev/sdk/releases/download/${SDK_VERSION}/ps5-payload-sdk.zip"
          sudo unzip -q -o -d /opt sdk.zip
          sudo chmod -R +x /opt/ps5-payload-sdk/bin

      # -Wall -Wextra -Werror: any warning fails the build.
      - name: Build
        run: |
          export PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
          make
          file anycontroller.elf

      - uses: actions/upload-artifact@v4
        with:
          name: anycontroller-${{ github.sha }}
          path: anycontroller.elf
          if-no-files-found: error
