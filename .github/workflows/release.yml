name: Release

# Push a version tag (e.g. v0.1.0) and the payload is built and published as
# a GitHub release, so users can download anycontroller.elf without a toolchain.
on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

env:
  SDK_VERSION: v0.45
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build and publish payload
    runs-on: ubuntu-latest
    steps:
      # A manual run must check out the tag, not main.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Check tag matches source version
        run: |
          major=$(awk '/ANYCONTROLLER_VERSION_MAJOR/ {print $3}' include/anycontroller.h)
          minor=$(awk '/ANYCONTROLLER_VERSION_MINOR/ {print $3}' include/anycontroller.h)
          patch=$(awk '/ANYCONTROLLER_VERSION_PATCH/ {print $3}' include/anycontroller.h)
          expected="v${major}.${minor}.${patch}"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::Tag $TAG does not match include/anycontroller.h ($expected)"
            exit 1
          fi

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm make unzip curl

      - name: Install PS5 payload SDK
        run: |
          curl -fsSL -o sdk.zip \
            "https://github.com/ps5-payload-dev/sdk/releases/download/${SDK_VERSION}/ps5-payload-sdk.zip"
          sudo unzip -q -o -d /opt sdk.zip
          sudo chmod -R +x /opt/ps5-payload-sdk/bin

      - name: Build
        run: |
          export PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
          make
          file anycontroller.elf

      # Payload Manager metadata: copy the .elf and .elf.json together into
      # /data/pldmgr/payloads/anycontroller/.
      - name: Checksums and metadata
        run: |
          sha=$(sha256sum anycontroller.elf | cut -d' ' -f1)
          sha256sum anycontroller.elf > SHA256SUMS
          cat > anycontroller.elf.json <<META
          {
            "name": "AnyController",
            "filename": "anycontroller.elf",
            "description": "Use Switch Pro and Xbox/XInput controllers as a virtual DualSense",
            "version": "${TAG}",
            "checksum": "${sha}",
            "category": "Utilities",
            "source": "https://github.com/${GITHUB_REPOSITORY}"
          }
          META
          cat SHA256SUMS anycontroller.elf.json

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: AnyController ${{ env.TAG }}
          generate_release_notes: true
          files: |
            anycontroller.elf
            anycontroller.elf.json
            SHA256SUMS
          body: |
            ## Install

            **Direct:** send `anycontroller.elf` to your ELF loader on port 9021, e.g.
            `python3 send_payload.py <PS5_IP> anycontroller.elf`

            **Payload Manager:** copy `anycontroller.elf` and `anycontroller.elf.json`
            into `/data/pldmgr/payloads/anycontroller/` over FTP, then launch it.

            ## Use

            Plug in a Switch Pro Controller (USB) or an Xbox 360 / XInput controller
            (USB or 2.4GHz dongle). It appears as a DualSense, user picker and PS button
            included. See the README for the button mapping.

            Verify your download against `SHA256SUMS`.
