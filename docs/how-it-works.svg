<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-labelledby="t d">
  <title id="t">How AnyController works</title>
  <desc id="d">Five steps: the controller connects over USB or a 2.4GHz dongle; AnyController opens it through the PS5's ugen USB nodes; a driver turns its reports into one common format; the /dev/hid virtual pad interface registers a DualSense and streams input; the PS5 sees a DualSense everywhere.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4C86FF"/>
    </marker>
  </defs>

  <rect width="1280" height="300" rx="24" fill="#0A1022"/>
  <rect x="0.5" y="0.5" width="1279" height="299" rx="24" fill="none" stroke="#1B2742"/>

  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
    <g fill="#111A31" stroke="#22305A">
      <rect x="35" y="40" width="210" height="220" rx="16"/>
      <rect x="285" y="40" width="210" height="220" rx="16"/>
      <rect x="535" y="40" width="210" height="220" rx="16"/>
      <rect x="785" y="40" width="210" height="220" rx="16"/>
    </g>
    <rect x="1035" y="40" width="210" height="220" rx="16" fill="#0F2350" stroke="#3E86FF" stroke-width="2"/>

    <g stroke="#4C86FF" stroke-width="3" marker-end="url(#arrow)">
      <line x1="249" y1="150" x2="279" y2="150"/>
      <line x1="499" y1="150" x2="529" y2="150"/>
      <line x1="749" y1="150" x2="779" y2="150"/>
      <line x1="999" y1="150" x2="1029" y2="150"/>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#6F86C9" letter-spacing="1">
      <text x="57" y="80">01</text>
      <text x="307" y="80">02</text>
      <text x="557" y="80">03</text>
      <text x="807" y="80">04</text>
      <text x="1057" y="80">05</text>
    </g>

    <g font-size="24" font-weight="700" fill="#F2F5FF">
      <text x="57" y="118">Controller</text>
      <text x="307" y="118">USB access</text>
      <text x="557" y="118">Driver</text>
      <text x="807" y="118">Virtual pad</text>
      <text x="1057" y="118">PS5</text>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#7FA2FF">
      <text x="57" y="148">USB or 2.4GHz</text>
      <text x="307" y="148">/dev/usb/B.A.E</text>
      <text x="557" y="148">switch_pro, xbox360</text>
      <text x="807" y="148">/dev/hid ioctls</text>
      <text x="1057" y="148">virtual DualSense</text>
    </g>

    <g font-size="15" fill="#AEBADB">
      <text x="57" y="196">Switch Pro, Xbox 360</text>
      <text x="57" y="220">and XInput pads</text>
      <text x="307" y="196">Sony's driver off,</text>
      <text x="307" y="220">endpoints claimed</text>
      <text x="557" y="196">Handshake, then</text>
      <text x="557" y="220">one input format</text>
      <text x="807" y="196">Registers a pad,</text>
      <text x="807" y="220">streams input</text>
      <text x="1057" y="196">Home, user picker,</text>
      <text x="1057" y="220">PS button, games</text>
    </g>
  </g>
</svg>
